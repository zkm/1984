<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>War and Peace Reader</title>
  <meta name="description" content="Read an 'americanized' edition of Leo Tolstoy's War and Peace, chapter by chapter.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Source+Sans+3:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/reader.css">

  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="bar">
    <button class="btn" id="toc-button" aria-label="Contents" title="Contents (C)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 6h16M4 12h16M4 18h10"/>
      </svg>
      <span class="label">Contents</span>
    </button>

    <div class="where" id="where"></div>

    <button class="btn" id="smaller-text" aria-label="Smaller text" title="Smaller text">A−</button>
    <button class="btn btn-large" id="larger-text" aria-label="Larger text" title="Larger text">A+</button>
    <button class="btn" id="theme-button" aria-label="Change theme" title="Change theme">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
      </svg>
    </button>

    <div class="progress" id="progress"></div>
  </header>

  <div class="scrim" id="scrim"></div>

  <aside class="drawer" id="drawer" aria-label="Contents">
    <header>
      <h2><a href="#/">Contents</a></h2>
      <button class="btn" id="close-toc" aria-label="Close contents">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </header>
    <nav class="toc" id="toc"></nav>
  </aside>

  <main id="app">
    <div class="status">Loading the book…</div>
  </main>
</body>
</html>
