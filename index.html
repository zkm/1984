<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nineteen Eighty-Four Reader</title>
<meta name="description" content="A private reader for your own copy of Nineteen Eighty-Four. Open a text file from your device; nothing is uploaded.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='4' width='20' height='24' rx='2' fill='%23a1231b'/%3E%3Crect x='9' y='4' width='2' height='24' fill='rgba(0,0,0,.25)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fbfaf7;
  --panel: #ffffff;
  --line: #e4e0d6;
  --text: #24211d;
  --muted: #6e675d;
  --accent: #a1231b;
  --accent-soft: color-mix(in srgb, var(--accent) 12%, var(--bg));
  --on-accent: #ffffff;
  --shadow: rgba(30, 20, 10, .18);
  --size: 19px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --bg: #131210;
    --panel: #1b1a17;
    --line: #2e2b26;
    --text: #e2ddd3;
    --muted: #9a9386;
    --accent: #f07a6e;
    --on-accent: #131210;
    --shadow: rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  --bg: #131210;
  --panel: #1b1a17;
  --line: #2e2b26;
  --text: #e2ddd3;
  --muted: #9a9386;
  --accent: #f07a6e;
  --on-accent: #131210;
  --shadow: rgba(0, 0, 0, .5);
}
:root[data-theme="sepia"] {
  --bg: #f3e9d6;
  --panel: #f8f0e0;
  --line: #e0d2b8;
  --text: #3b2f22;
  --muted: #7a6750;
  --shadow: rgba(60, 40, 10, .2);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 "Source Sans 3", system-ui, sans-serif;
}
a { color: var(--accent); }
button { font: inherit; color: inherit; }

/* Top bar */
.bar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 8px;
  height: 52px; padding: 0 12px;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}
.progress { position: absolute; left: 0; bottom: -1px; height: 2px; background: var(--accent); width: 0; transition: width .2s; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-width: 36px; height: 36px; padding: 0 10px; border-radius: 8px;
  border: 1px solid transparent; background: transparent; cursor: pointer; color: var(--muted);
  text-decoration: none; font-size: 14px;
}
.btn:hover { background: var(--accent-soft); color: var(--text); }
.btn:focus-visible, .primary:focus-visible, .secondary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.where {
  flex: 1; min-width: 0; text-align: center;
  font-size: 14px; color: var(--muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.where a { color: inherit; text-decoration: none; }
.where b { color: var(--text); font-weight: 600; }

/* Drawer */
.scrim { position: fixed; inset: 0; z-index: 30; background: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .2s; }
.drawer {
  position: fixed; z-index: 31; top: 0; bottom: 0; left: 0; width: min(340px, 88vw);
  display: flex; flex-direction: column;
  background: var(--panel); border-right: 1px solid var(--line);
  transform: translateX(-100%); transition: transform .22s ease;
}
body.toc-open .scrim { opacity: 1; pointer-events: auto; }
body.toc-open .drawer { transform: none; box-shadow: 0 0 40px var(--shadow); }
.drawer header { display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 12px 18px; border-bottom: 1px solid var(--line); }
.drawer header h2 { margin: 0; font-size: 15px; font-weight: 600; }
.toc { overflow-y: auto; padding: 6px 0 32px; }
.toc details { border-bottom: 1px solid var(--line); }
.toc summary {
  display: flex; justify-content: space-between; gap: 8px; cursor: pointer;
  padding: 11px 18px; font-weight: 600; font-size: 15px; list-style: none;
}
.toc summary::-webkit-details-marker { display: none; }
.toc summary span { color: var(--muted); font-weight: 400; font-size: 13px; }
.toc .chs { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 4px; padding: 0 14px 14px; }
.toc .flat { padding-top: 14px; }
.toc .chs a {
  display: block; padding: 6px 0; text-align: center; border-radius: 6px;
  color: var(--text); text-decoration: none; font-size: 13px; background: var(--bg);
}
.toc .chs a:hover { background: var(--accent-soft); }
.toc .chs a[aria-current="true"] { background: var(--accent); color: var(--on-accent); }
.toc .empty { padding: 18px; color: var(--muted); font-size: 14px; }

/* Cover */
.cover { max-width: 760px; margin: 0 auto; padding: 64px 20px 96px; }
.cover .kicker { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.cover h1 { font: 600 clamp(38px, 8vw, 68px)/1.05 "Literata", Georgia, serif; margin: 10px 0 8px; letter-spacing: -.01em; }
.cover .by { font: italic 20px "Literata", Georgia, serif; color: var(--muted); margin: 0 0 32px; }
.drop {
  display: block; padding: 36px 24px; border: 2px dashed var(--line); border-radius: 14px;
  background: var(--panel); text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
}
.drop:hover, body.dragging .drop { border-color: var(--accent); background: var(--accent-soft); }
.drop b { display: block; font-size: 18px; margin-bottom: 6px; }
.drop .pick {
  display: inline-block; margin: 10px 0 12px; padding: 9px 16px; border-radius: 10px;
  background: var(--accent); color: var(--on-accent); font-weight: 600;
}
.drop small { display: block; color: var(--muted); font-size: 14px; max-width: 460px; margin: 0 auto; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.error { margin: 14px 0 0; color: var(--accent); font-weight: 500; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 14px; color: var(--muted); margin-bottom: 28px; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 48px; }
.primary {
  display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 10px;
  background: var(--accent); color: var(--on-accent); text-decoration: none; font-weight: 600;
}
.secondary {
  display: inline-flex; align-items: center; padding: 11px 18px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--text); text-decoration: none; font-weight: 500;
}
.primary:hover, .secondary:hover { filter: brightness(1.05); }
.cover h2 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
.parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.parts.chapters { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.parts a {
  display: block; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel); color: var(--text); text-decoration: none;
}
.parts a:hover { border-color: var(--accent); }
.parts b { display: block; font: 600 17px "Literata", Georgia, serif; }
.parts span { font-size: 13px; color: var(--muted); }
.foot { margin-top: 48px; font-size: 13px; color: var(--muted); }
.foot button { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; font-size: 13px; }

/* Chapter */
.chapter { max-width: 40em; margin: 0 auto; padding: 48px 20px 40px; font-size: var(--size); }
.chapter .part { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin: 0; font-family: "Source Sans 3", system-ui, sans-serif; }
.chapter h1 { font: 600 1.9em/1.15 "Literata", Georgia, serif; margin: .25em 0 1.2em; }
.prose { font-family: "Literata", Georgia, serif; line-height: 1.7; hyphens: auto; -webkit-hyphens: auto; }
.prose p { margin: 0 0 1em; }
.prose p + p { text-indent: 1.4em; margin-top: -.4em; }
.prose .sign { text-align: center; text-indent: 0; letter-spacing: .08em; font-size: .9em; margin: 1em 0; }
.prose .brk { text-align: center; text-indent: 0; color: var(--muted); letter-spacing: .6em; margin: 1.6em 0; }
.prose .sign + p, .prose .brk + p { text-indent: 0; margin-top: 0; }
.nav {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  max-width: 40em; margin: 0 auto; padding: 8px 20px 80px;
}
.nav a {
  display: block; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--line);
  color: var(--text); text-decoration: none; background: var(--panel);
}
.nav a:hover { border-color: var(--accent); }
.nav small { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.nav .next { text-align: right; grid-column: 2; }
.status { max-width: 40em; margin: 0 auto; padding: 80px 20px; color: var(--muted); text-align: center; }

@media (max-width: 560px) {
  .btn .lbl { display: none; }
  .chapter { padding-top: 32px; }
  .cover { padding-top: 40px; }
}
@media print {
  .bar, .drawer, .scrim, .nav { display: none !important; }
}
</style>
</head>
<body>
<header class="bar">
  <button class="btn" id="tocBtn" aria-label="Contents" title="Contents (C)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    <span class="lbl">Contents</span>
  </button>
  <div class="where" id="where"></div>
  <button class="btn" id="smaller" aria-label="Smaller text" title="Smaller text">A−</button>
  <button class="btn" id="larger" aria-label="Larger text" title="Larger text" style="font-size:17px">A+</button>
  <button class="btn" id="themeBtn" aria-label="Change theme" title="Change theme">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
  </button>
  <div class="progress" id="progress"></div>
</header>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Contents">
  <header>
    <h2><a href="#/" style="color:inherit;text-decoration:none">Contents</a></h2>
    <button class="btn" id="closeToc" aria-label="Close contents">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <nav class="toc" id="toc"></nav>
</aside>

<main id="app"><div class="status">Loading…</div></main>

<script>
// Book settings. The reader code below is the same for every book.
const BOOK = {
  "id": "1984",
  "title": "Nineteen Eighty-Four",
  "author": "George Orwell",
  "year": 1949,
  "rules": {
    "part": {
      "re": "^\\* Chapter (One|Two|Three) \\*$",
      "label": "Part $1"
    },
    "chapterBreak": "^x x x$",
    "extraParts": [
      {
        "re": "^\\* APPENDIX\\. (.+?) \\*$",
        "part": "Appendix",
        "chapter": "$1"
      }
    ]
  }
};
</script>
<script>
// ---- lib start
const Lib = (function () {
  'use strict';

  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function typo(s) { return esc(s).replace(/--/g, '—'); }
  function fill(label, m) { return label.replace(/\$(\d)/g, function (_, i) { return m[+i] || ''; }); }
  function words(s) { return s.split(/\s+/).filter(Boolean).length; }

  // Split text into parts and chapters using the book's heading patterns.
  function split(lines, rules) {
    const part = rules.part && new RegExp(rules.part.re);
    const chap = rules.chapter && new RegExp(rules.chapter.re);
    const brk = rules.chapterBreak && new RegExp(rules.chapterBreak);
    const extra = (rules.extraParts || []).map(function (x) { return { re: new RegExp(x.re), x: x }; });
    const parts = [];
    let cur = null, ch = null;
    function newPart(name) { cur = { name: name, chapters: [] }; parts.push(cur); ch = null; }
    function newChapter(title) {
      if (!cur) newPart('');
      ch = { title: title, lines: [] };
      cur.chapters.push(ch);
    }
    lines.forEach(function (line) {
      const t = line.trim();
      let m;
      for (let i = 0; i < extra.length; i++) {
        if ((m = t.match(extra[i].re))) { newPart(fill(extra[i].x.part, m)); newChapter(fill(extra[i].x.chapter, m)); return; }
      }
      if (part && (m = t.match(part))) {
        newPart(fill(rules.part.label, m));
        if (brk) newChapter('Chapter 1');
        return;
      }
      if (chap && (m = t.match(chap))) { newChapter(fill(rules.chapter.label, m)); return; }
      if (brk && cur && brk.test(t)) {
        // A break right after a heading (before any text) would open an empty chapter.
        if (!ch || ch.lines.some(function (l) { return l.trim(); })) newChapter('Chapter ' + (cur.chapters.length + 1));
        return;
      }
      if (ch) ch.lines.push(line);
    });
    return parts;
  }

  const GENERIC = [
    { chapter: { re: '^\\**\\s*(?:CHAPTER|Chapter)\\s+([A-Za-z0-9-]+)\\.?\\s*\\**$', label: 'Chapter $1' } },
    { chapter: { re: '^([0-9]{1,3}|[IVXLC]{1,7})\\.?$', label: 'Chapter $1' } }
  ];

  // Fallback when no headings are found: sections of roughly 4,000 words.
  function bySize(lines) {
    const part = { name: '', chapters: [] };
    let ch = null, n = 0;
    lines.forEach(function (line) {
      if (!ch || (n > 4000 && !line.trim())) { ch = { title: 'Section ' + (part.chapters.length + 1), lines: [] }; part.chapters.push(ch); n = 0; }
      ch.lines.push(line);
      n += words(line);
    });
    return [part];
  }

  function count(parts) { return parts.reduce(function (n, p) { return n + p.chapters.length; }, 0); }

  function parse(text, book) {
    const lines = text.replace(/^﻿/, '').replace(/\r\n?/g, '\n').split('\n');
    let parts = split(lines, book.rules);
    if (count(parts) < 2) {
      for (let i = 0; i < GENERIC.length && count(parts) < 2; i++) parts = split(lines, GENERIC[i]);
    }
    if (count(parts) < 2) parts = bySize(lines);
    parts = parts.filter(function (p) { return p.chapters.length; });

    const flat = [];
    let total = 0;
    parts.forEach(function (p, pi) {
      p.chapters.forEach(function (ch, ci) {
        ch.part = pi; ch.index = ci; ch.global = flat.length;
        ch.words = words(ch.lines.join(' '));
        ch.wordsBefore = total; total += ch.words;
        flat.push(ch);
      });
    });
    return { parts: parts, flat: flat, words: total, single: parts.length === 1 && !parts[0].name };
  }

  // Blank lines separate blocks. Long lines are one paragraph each;
  // short hard-wrapped lines are joined into a paragraph.
  function renderProse(lines, book) {
    const scene = book.rules.sceneBreak && new RegExp(book.rules.sceneBreak);
    const blocks = [];
    let cur = [];
    lines.forEach(function (l) {
      if (l.trim()) cur.push(l.replace(/\s+$/, ''));
      else if (cur.length) { blocks.push(cur); cur = []; }
    });
    if (cur.length) blocks.push(cur);
    const out = [];
    blocks.forEach(function (b) {
      const avg = b.reduce(function (n, l) { return n + l.length; }, 0) / b.length;
      const paras = b.length > 1 && avg > 90 ? b.map(function (l) { return [l]; }) : [b];
      paras.forEach(function (p) {
        const t = p.map(function (l) { return l.trim(); }).join(' ');
        if (scene && scene.test(t)) out.push('<p class="brk">* * *</p>');
        else if (t.length <= 40 && /[A-Z]/.test(t) && !/[a-z]/.test(t)) out.push('<p class="sign">' + typo(t) + '</p>');
        else out.push('<p>' + typo(t) + '</p>');
      });
    });
    return out.join('');
  }

  return { esc: esc, parse: parse, renderProse: renderProse };
})();
if (typeof module !== 'undefined') module.exports = Lib;
// ---- lib end
</script>
<script>
(function () {
  'use strict';

  const esc = Lib.esc;
  const WPM = 230;
  const app = document.getElementById('app');
  const where = document.getElementById('where');
  const tocEl = document.getElementById('toc');
  const progress = document.getElementById('progress');
  const root = document.documentElement;
  let book = null;
  let fileName = '';
  let current = null;
  let error = '';

  // ---------- small storage (best effort) ----------
  function load(key) { try { return JSON.parse(localStorage.getItem(BOOK.id + '-' + key)); } catch (e) { return null; } }
  function save(key, val) { try { localStorage.setItem(BOOK.id + '-' + key, JSON.stringify(val)); } catch (e) { /* ignore */ } }
  function drop(key) { try { localStorage.removeItem(BOOK.id + '-' + key); } catch (e) { /* ignore */ } }

  // ---------- the book file, kept only in this browser (IndexedDB) ----------
  function db() {
    return new Promise(function (resolve, reject) {
      const req = indexedDB.open('book-reader', 1);
      req.onupgradeneeded = function () { req.result.createObjectStore('books'); };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }
  function idb(mode, fn) {
    return db().then(function (d) {
      return new Promise(function (resolve, reject) {
        const tx = d.transaction('books', mode);
        const req = fn(tx.objectStore('books'));
        tx.oncomplete = function () { resolve(req && req.result); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }
  function storeFile(rec) { return idb('readwrite', function (s) { return s.put(rec, BOOK.id); }).catch(function () { /* not kept */ }); }
  function readFile() { return idb('readonly', function (s) { return s.get(BOOK.id); }).catch(function () { return null; }); }
  function forgetFile() { return idb('readwrite', function (s) { return s.delete(BOOK.id); }).catch(function () { /* ignore */ }); }

  // ---------- reading preferences ----------
  const THEMES = [null, 'sepia', 'dark', 'light'];
  let theme = load('theme');
  let size = load('size') || 19;
  function applyPrefs() {
    if (theme) root.dataset.theme = theme; else delete root.dataset.theme;
    root.style.setProperty('--size', size + 'px');
  }
  applyPrefs();
  document.getElementById('themeBtn').addEventListener('click', function () {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    save('theme', theme); applyPrefs();
  });
  document.getElementById('smaller').addEventListener('click', function () { size = Math.max(14, size - 1); save('size', size); applyPrefs(); });
  document.getElementById('larger').addEventListener('click', function () { size = Math.min(28, size + 1); save('size', size); applyPrefs(); });

  // ---------- drawer ----------
  function openToc(open) {
    document.body.classList.toggle('toc-open', open);
    if (open) {
      const cur = tocEl.querySelector('[aria-current="true"]');
      if (cur) { const d = cur.closest('details'); if (d) d.open = true; cur.scrollIntoView({ block: 'center' }); }
    }
  }
  document.getElementById('tocBtn').addEventListener('click', function () { openToc(!document.body.classList.contains('toc-open')); });
  document.getElementById('closeToc').addEventListener('click', function () { openToc(false); });
  document.getElementById('scrim').addEventListener('click', function () { openToc(false); });
  tocEl.addEventListener('click', function (e) { if (e.target.closest('a')) openToc(false); });

  // ---------- helpers ----------
  function href(ch) { return '#/' + (ch.part + 1) + '/' + (ch.index + 1); }
  function chLabel(ch) {
    const p = book.parts[ch.part];
    return p.name ? p.name + ', ' + ch.title : ch.title;
  }
  function shortNum(ch) { const m = ch.title.match(/(\S+)$/); return m ? m[1] : String(ch.index + 1); }
  function hours(w) {
    const h = w / WPM / 60;
    return h >= 1.5 ? Math.round(h) + ' hours' : Math.max(1, Math.round(w / WPM)) + ' min';
  }

  function buildToc() {
    if (!book) { tocEl.innerHTML = '<div class="empty">Open your copy of the book to see its contents.</div>'; return; }
    function grid(chs, cls) {
      return '<div class="chs ' + (cls || '') + '">' + chs.map(function (ch) {
        return '<a href="' + href(ch) + '" data-g="' + ch.global + '" title="' + esc(chLabel(ch)) + '">' + esc(shortNum(ch)) + '</a>';
      }).join('') + '</div>';
    }
    tocEl.innerHTML = book.single
      ? grid(book.parts[0].chapters, 'flat')
      : book.parts.map(function (p) {
          return '<details><summary>' + esc(p.name) + '<span>' + p.chapters.length + '</span></summary>' + grid(p.chapters) + '</details>';
        }).join('');
  }

  function markToc(g) {
    tocEl.querySelectorAll('a[aria-current]').forEach(function (a) { a.removeAttribute('aria-current'); });
    const a = tocEl.querySelector('a[data-g="' + g + '"]');
    if (a) a.setAttribute('aria-current', 'true');
  }

  // ---------- opening a file ----------
  function decode(buf) {
    const utf8 = new TextDecoder('utf-8').decode(buf);
    return utf8.indexOf('�') === -1 ? utf8 : new TextDecoder('windows-1252').decode(buf);
  }

  function openFile(file) {
    if (!file) return;
    error = '';
    if (file.size > 20 * 1024 * 1024) { error = 'That file is too large to be a plain-text book.'; showCover(); return; }
    file.arrayBuffer().then(function (buf) {
      const text = decode(buf);
      const parsed = Lib.parse(text, BOOK);
      if (parsed.words < 1000) { error = 'That file does not look like a book (' + parsed.words + ' words). Choose a plain .txt file.'; showCover(); return; }
      book = parsed; fileName = file.name;
      drop('pos');
      buildToc();
      storeFile({ name: file.name, text: text, saved: Date.now() });
      if (location.hash.length > 2) location.hash = '#/'; else showCover();
    }).catch(function () { error = 'Could not read that file.'; showCover(); });
  }

  addEventListener('dragover', function (e) { e.preventDefault(); document.body.classList.add('dragging'); });
  addEventListener('dragleave', function (e) { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
  addEventListener('drop', function (e) {
    e.preventDefault();
    document.body.classList.remove('dragging');
    openFile(e.dataTransfer.files[0]);
  });

  // ---------- views ----------
  function dropZone(again) {
    return '<label class="drop">' +
      '<b>' + (again ? 'Open a different copy' : 'Open your copy of the book') + '</b>' +
      '<span class="pick">Choose a .txt file</span>' +
      '<small>Or drop it anywhere on this page. The file is read in your browser and kept only on this device. Nothing is uploaded.</small>' +
      '<input type="file" accept=".txt,text/plain" id="fileInput">' +
      '</label>' + (error ? '<p class="error">' + esc(error) + '</p>' : '');
  }

  function showCover() {
    current = null;
    markToc(-1);
    document.title = BOOK.title + ' Reader';
    where.innerHTML = '<b>' + esc(BOOK.title) + '</b>';
    progress.style.width = '0';
    let html = '<section class="cover">' +
      '<div class="kicker">Private reader</div>' +
      '<h1>' + esc(BOOK.title) + '</h1>' +
      '<p class="by">' + esc(BOOK.author) + (BOOK.year ? ' · ' + BOOK.year : '') + '</p>';
    if (!book) {
      html += dropZone(false);
    } else {
      const pos = load('pos');
      const resume = pos && book.flat[pos.g];
      const first = book.flat[0];
      html +=
        '<div class="stats"><span>' + esc(fileName) + '</span>' +
          (book.single ? '' : '<span>' + book.parts.length + ' parts</span>') +
          '<span>' + book.flat.length + ' chapters</span><span>' + Math.round(book.words / 1000) + 'k words</span>' +
          '<span>about ' + hours(book.words) + ' of reading</span></div>' +
        '<div class="cta">' +
          (resume
            ? '<a class="primary" href="' + href(resume) + '">Continue · ' + esc(chLabel(resume)) + ' →</a>' +
              '<a class="secondary" href="' + href(first) + '">Start from the beginning</a>'
            : '<a class="primary" href="' + href(first) + '">Start reading →</a>') +
        '</div>' +
        '<h2>Contents</h2>' +
        (book.single
          ? '<div class="parts chapters">' + book.flat.map(function (ch) {
              return '<a href="' + href(ch) + '"><b>' + esc(ch.title) + '</b><span>' + hours(ch.words) + '</span></a>';
            }).join('') + '</div>'
          : '<div class="parts">' + book.parts.map(function (p) {
              const w = p.chapters.reduce(function (n, c) { return n + c.words; }, 0);
              return '<a href="' + href(p.chapters[0]) + '"><b>' + esc(p.name) + '</b><span>' +
                p.chapters.length + (p.chapters.length === 1 ? ' chapter' : ' chapters') + ' · ' + hours(w) + '</span></a>';
            }).join('') + '</div>') +
        '<div style="margin-top:40px">' + dropZone(true) + '</div>' +
        '<p class="foot">The book is stored only in this browser. <button type="button" id="forget">Remove it from this device</button></p>';
    }
    html += '</section>';
    app.innerHTML = html;
    const input = document.getElementById('fileInput');
    if (input) input.addEventListener('change', function () { openFile(input.files[0]); });
    const forget = document.getElementById('forget');
    if (forget) forget.addEventListener('click', function () {
      forgetFile(); drop('pos'); book = null; fileName = ''; error = '';
      buildToc(); showCover();
    });
    window.scrollTo(0, 0);
  }

  function showChapter(ch, restoreY) {
    current = ch;
    const p = book.parts[ch.part];
    const prev = book.flat[ch.global - 1], next = book.flat[ch.global + 1];
    markToc(ch.global);
    document.title = chLabel(ch) + ' · ' + BOOK.title;
    where.innerHTML = '<a href="#/">' + esc(BOOK.title) + '</a> · <b>' + esc(chLabel(ch)) + '</b>';
    app.innerHTML =
      '<article class="chapter">' +
        (p.name ? '<p class="part">' + esc(p.name) + '</p>' : '') +
        '<h1>' + esc(ch.title) + '</h1>' +
        '<div class="prose">' + Lib.renderProse(ch.lines, BOOK) + '</div>' +
      '</article>' +
      '<nav class="nav">' +
        (prev ? '<a class="prev" href="' + href(prev) + '"><small>← Previous</small>' + esc(chLabel(prev)) + '</a>' : '') +
        (next ? '<a class="next" href="' + href(next) + '"><small>Next →</small>' + esc(chLabel(next)) + '</a>'
              : '<a class="next" href="#/"><small>The end</small>Back to the cover</a>') +
      '</nav>';
    const max = Math.max(1, document.documentElement.scrollHeight - innerHeight);
    window.scrollTo(0, restoreY ? restoreY * max : 0);
    savePos();
  }

  function scrollFraction() {
    const max = document.documentElement.scrollHeight - innerHeight;
    return max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
  }

  function savePos() {
    if (!current) return;
    const f = scrollFraction();
    save('pos', { g: current.global, y: f });
    progress.style.width = (((current.wordsBefore + current.words * f) / Math.max(1, book.words)) * 100).toFixed(2) + '%';
  }

  let pending = false;
  addEventListener('scroll', function () {
    if (pending) return;
    pending = true;
    requestAnimationFrame(function () { pending = false; savePos(); });
  }, { passive: true });

  function route() {
    openToc(false);
    const m = location.hash.match(/^#\/(\d+)\/(\d+)$/);
    if (!m || !book) { showCover(); return; }
    const p = book.parts[+m[1] - 1];
    const ch = p && p.chapters[+m[2] - 1];
    if (!ch) { location.replace('#/'); return; }
    const pos = load('pos');
    showChapter(ch, pos && pos.g === ch.global && !current ? pos.y : 0);
  }

  addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === 'Escape') openToc(false);
    if (e.key === 'c') openToc(!document.body.classList.contains('toc-open'));
    if (!current) return;
    if (e.key === 'ArrowRight' && book.flat[current.global + 1]) location.hash = href(book.flat[current.global + 1]);
    if (e.key === 'ArrowLeft' && book.flat[current.global - 1]) location.hash = href(book.flat[current.global - 1]);
  });

  readFile().then(function (rec) {
    if (rec && rec.text) {
      book = Lib.parse(rec.text, BOOK);
      fileName = rec.name;
    }
    buildToc();
    addEventListener('hashchange', route);
    route();
  });
})();
</script>
</body>
</html>
